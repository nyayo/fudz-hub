<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FF6B00" />

    <title>Fogo Dashboard</title>
    <meta
      name="description"
      content="Manage orders, menus, promotions, deliveries and reviews for your restaurant in one place."
    />
    <meta name="author" content="YourApp" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="YourApp" />
    <meta property="og:title" content="Fogo Dashboard" />

      property="og:description"
      content="Manage orders, menus, promotions, deliveries and reviews for your restaurant in one place."

      name="twitter:description"

    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
